[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalstats"
version = "0.1.0"
description = "Error bars and paired comparisons for model evaluations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vipul Raj Jha" }]
keywords = ["evaluation", "bootstrap", "confidence-interval", "mcnemar", "pass-at-k"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
evalstats = "evalstats.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/evalstats"

[tool.hatch.build.targets.wheel]
packages = ["src/evalstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.coverage.run]
source = ["evalstats"]
